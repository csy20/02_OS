general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = /usr/share/backgrounds/02os/desktop.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.7
}

input-field {
    monitor =
    size = 280, 44
    outline_thickness = 1
    dots_size = 0.25
    inner_color = rgba(20, 20, 20, 0.55)
    outer_color = rgba(255, 255, 255, 0.25)
    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    placeholder_text = <i>password</i>
    rounding = 12
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 0.95)
    font_size = 72
    font_family = Inter
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = 02_OS
    color = rgba(255, 255, 255, 0.7)
    font_size = 18
    font_family = Inter
    position = 0, 160
    halign = center
    valign = center
}
