$mainMod = SUPER

# Spotlight (Mac) + Alt+Space
bind = $mainMod, SPACE, exec, 02os-spotlight
bind = ALT, SPACE, exec, 02os-spotlight

# Windows-accurate Alt+F4: close window, or power dialog on the desktop
bind = ALT, F4, exec, 02os-alt-f4

# App lifecycle (Mac-ish)
bind = $mainMod, Q, killactive
bind = $mainMod, W, killactive
bind = $mainMod, T, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, N, exec, $filemanager
bind = $mainMod, B, exec, $browser

# Mission Control
bind = $mainMod, TAB, exec, 02os-window-switcher

# Hide (Mac) / show hidden
bind = $mainMod, H, movetoworkspacesilent, special:hidden
bind = $mainMod CTRL, H, togglespecialworkspace, hidden

# Spaces
bind = $mainMod CTRL, left, workspace, e-1
bind = $mainMod CTRL, right, workspace, e+1

# Lock
bind = $mainMod, L, exec, hyprlock

# Screenshots (Mac-style)
bind = $mainMod SHIFT, 3, exec, 02os-screenshot screen
bind = $mainMod SHIFT, 4, exec, 02os-screenshot area
bind = , Print, exec, 02os-screenshot area

# Clipboard history
bind = $mainMod SHIFT, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# Apple menu
bind = $mainMod, A, exec, 02os-apple-menu

# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u

# Move window
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume / brightness
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
