# 02_OS Hyprland 0.56 — Mac-like floating desktop
$terminal = kitty
$menu = 02os-spotlight
$browser = firefox
$filemanager = thunar

monitor=,preferred,auto,1

env = XCURSOR_THEME,capitaine-cursors
env = XCURSOR_SIZE,24
env = GTK_THEME,adw-gtk3-dark
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,gtk3
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = xdg-user-dirs-update
exec-once = hyprpaper
exec-once = waybar
exec-once = nwg-dock-hyprland -i 48 -mb 8 -p bottom
exec-once = swaync
exec-once = hypridle
exec-once = udiskie -a -n -s
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = /usr/lib/hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = wlsunset -t 4000 -T 6500
exec-once = hyprctl setcursor capitaine-cursors 24
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'adw-gtk3-dark'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'capitaine-cursors'
exec-once = gsettings set org.gnome.desktop.interface font-name 'Inter 11'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(ffffffaa)
    col.inactive_border = rgba(ffffff22)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    blur {
        enabled = true
        size = 4
        passes = 2
    }
    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000066)
    }
}

animations {
    enabled = true
    bezier = md3, 0.22, 1.0, 0.36, 1.0
    animation = windows, 1, 4, md3, popin 85%
    animation = windowsOut, 1, 4, md3, popin 85%
    animation = fade, 1, 3, md3
    animation = workspaces, 1, 4, md3, slide
    animation = layers, 1, 3, md3, fade
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
}

binds {
    workspace_back_and_forth = true
}

layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.2, match:namespace waybar
layerrule = blur on, match:namespace gtk-layer-shell
layerrule = ignore_alpha 0.2, match:namespace gtk-layer-shell
layerrule = blur on, match:namespace launcher
layerrule = blur on, match:namespace notifications

windowrule {
    name = firefox-mac
    match:class = firefox
    float = true
    center = true
}

windowrule {
    name = thunar-mac
    match:class = thunar
    float = true
    center = true
}

windowrule {
    name = pavucontrol-float
    match:class = pavucontrol
    float = true
}

windowrule {
    name = pavucontrol-org-float
    match:class = org.pulseaudio.pavucontrol
    float = true
}

windowrule {
    name = blueman-float
    match:class = blueman-manager
    float = true
}

windowrule {
    name = nm-editor-float
    match:class = nm-connection-editor
    float = true
}

windowrule {
    name = yad-float
    match:class = yad
    float = true
}

windowrule {
    name = shutdown-dialog
    match:title = Shut Down 02_OS
    float = true
    center = true
}

source = ./keybinds.conf
