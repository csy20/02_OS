<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ambient Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="folder-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.40"/>
    </filter>
    <filter id="pocket-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="glyph-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Glass Specular Rim Highlight -->
    <linearGradient id="specular-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Top Gloss Sheen Overlay -->
    <linearGradient id="top-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    
    <linearGradient id="bg-install" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="rocket-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="flame-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    
  </defs>
  
  <!-- Base Squircle with Shadow -->
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="url(#bg-install)" filter="url(#shadow)"/>

  <!-- Top Glass Sheen -->
  <path d="M 36 140 C 36 82, 82 36, 140 36 L 372 36 C 430 36, 476 82, 476 140 L 476 210 C 360 240, 150 240, 36 210 Z" fill="url(#top-gloss)"/>

  <!-- Center Hero Artwork -->
  <g filter="url(#glyph-shadow)">
    
    <!-- Holographic Disc Base -->
    <ellipse cx="256" cy="350" rx="140" ry="46" fill="#0f172a" opacity="0.4"/>
    <ellipse cx="256" cy="344" rx="136" ry="42" fill="none" stroke="#22d3ee" stroke-width="8" opacity="0.6"/>
    <ellipse cx="256" cy="344" rx="80" ry="24" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.8"/>

    <!-- Thruster Flame -->
    <path d="M 236 290 Q 256 360 256 380 Q 256 360 276 290 Z" fill="url(#flame-grad)"/>

    <!-- Ascending Rocket -->
    <g transform="translate(0, -20)">
      <!-- Fins -->
      <polygon points="200,290 230,240 230,290" fill="#0284c7"/>
      <polygon points="312,290 282,240 282,290" fill="#0284c7"/>
      <polygon points="256,295 244,240 268,240" fill="#0369a1"/>

      <!-- Rocket Body -->
      <path d="M 256 120 C 230 180, 226 250, 230 290 L 282 290 C 286 250, 282 180, 256 120 Z" fill="url(#rocket-body)"/>

      <!-- Window / Porthole -->
      <circle cx="256" cy="190" r="18" fill="#0284c7" stroke="#38bdf8" stroke-width="4"/>
      <circle cx="252" cy="186" r="5" fill="#ffffff"/>

      <!-- 02 Accent line -->
      <path d="M 248 240 L 264 240" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    </g>
    
  </g>

  <!-- Specular Rim Border -->
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="none" stroke="url(#specular-rim)" stroke-width="2.5"/>

</svg>