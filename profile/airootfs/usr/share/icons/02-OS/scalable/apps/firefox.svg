<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ambient Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="folder-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.40"/>
    </filter>
    <filter id="pocket-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="glyph-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Glass Specular Rim Highlight -->
    <linearGradient id="specular-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Top Gloss Sheen Overlay -->
    <linearGradient id="top-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    
    <linearGradient id="bg-firefox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="40%" stop-color="#581c87"/>
      <stop offset="80%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <radialGradient id="globe-glow" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="fox-flame" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="35%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    
  </defs>
  
  <!-- Base Squircle with Shadow -->
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="url(#bg-firefox)" filter="url(#shadow)"/>

  <!-- Top Glass Sheen -->
  <path d="M 36 140 C 36 82, 82 36, 140 36 L 372 36 C 430 36, 476 82, 476 140 L 476 210 C 360 240, 150 240, 36 210 Z" fill="url(#top-gloss)"/>

  <!-- Center Hero Artwork -->
  <g filter="url(#glyph-shadow)">
    
    <!-- Terrestrial Globe -->
    <circle cx="256" cy="256" r="128" fill="url(#globe-glow)"/>
    <ellipse cx="256" cy="256" rx="128" ry="46" fill="none" stroke="#60a5fa" stroke-width="3" opacity="0.4"/>
    <line x1="256" y1="128" x2="256" y2="384" stroke="#60a5fa" stroke-width="3" opacity="0.3"/>

    <!-- Circling Solar Flame Fox Tail & Head -->
    <path d="M 160 380 C 240 430, 360 400, 400 320 C 430 250, 410 170, 340 120 C 310 100, 270 90, 240 100 C 270 125, 285 160, 270 195 C 260 215, 235 225, 215 220 C 190 215, 175 190, 180 165 C 150 195, 130 240, 132 290 C 134 325, 142 355, 160 380 Z" fill="url(#fox-flame)"/>

    <!-- Fox Ear & Profile Highlight -->
    <polygon points="240,100 280,72 278,118" fill="#ea580c"/>
    <polygon points="246,102 274,82 272,114" fill="#fef08a"/>
    <circle cx="270" cy="148" r="8" fill="#ffffff"/>
    
  </g>

  <!-- Specular Rim Border -->
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="none" stroke="url(#specular-rim)" stroke-width="2.5"/>

</svg>