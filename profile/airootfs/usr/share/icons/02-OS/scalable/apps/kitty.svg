<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ambient Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="folder-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.40"/>
    </filter>
    <filter id="pocket-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="glyph-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Glass Specular Rim Highlight -->
    <linearGradient id="specular-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Top Gloss Sheen Overlay -->
    <linearGradient id="top-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    
    <linearGradient id="bg-kitty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181920"/>
      <stop offset="100%" stop-color="#0b0c0e"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1218"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>
    
  </defs>
  
  <!-- Base Squircle with Shadow -->
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="url(#bg-kitty)" filter="url(#shadow)"/>

  <!-- Top Glass Sheen -->
  <path d="M 36 140 C 36 82, 82 36, 140 36 L 372 36 C 430 36, 476 82, 476 140 L 476 210 C 360 240, 150 240, 36 210 Z" fill="url(#top-gloss)"/>

  <!-- Center Hero Artwork -->
  <g filter="url(#glyph-shadow)">
    
    <!-- Terminal Screen Recess -->
    <rect x="80" y="80" width="352" height="352" rx="36" ry="36" fill="url(#screen-grad)" stroke="#27272a" stroke-width="2"/>

    <!-- Titlebar Jelly Dots -->
    <circle cx="116" cy="116" r="9" fill="#ff5f56"/>
    <circle cx="144" cy="116" r="9" fill="#ffbd2e"/>
    <circle cx="172" cy="116" r="9" fill="#27c93f"/>

    <!-- Kitty Silhouette Emblem -->
    <path d="M 330 110 L 348 132 L 372 110 L 378 146 C 378 160, 368 170, 351 170 C 334 170, 324 160, 324 146 Z" fill="#818cf8" opacity="0.85"/>
    <polygon points="334,116 344,130 332,132" fill="#f472b6"/>
    <polygon points="368,116 358,130 370,132" fill="#f472b6"/>

    <!-- Prompt Chevron '>' -->
    <path d="M 126 190 L 196 240 L 126 290" fill="none" stroke="#22d3ee" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cursor '_' -->
    <line x1="226" y1="290" x2="310" y2="290" stroke="#4ade80" stroke-width="22" stroke-linecap="round"/>
    
    <!-- Code line preview -->
    <line x1="126" y1="350" x2="260" y2="350" stroke="#64748b" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
    <line x1="280" y1="350" x2="380" y2="350" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
    
  </g>

  <!-- Specular Rim Border -->
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="none" stroke="url(#specular-rim)" stroke-width="2.5"/>

</svg>