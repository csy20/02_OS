<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ambient Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="folder-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.40"/>
    </filter>
    <filter id="pocket-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="glyph-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Glass Specular Rim Highlight -->
    <linearGradient id="specular-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Top Gloss Sheen Overlay -->
    <linearGradient id="top-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    
    <linearGradient id="bg-spotlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f242e"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="prism-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="handle-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    
  </defs>
  
  <!-- Base Squircle with Shadow -->
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="url(#bg-spotlight)" filter="url(#shadow)"/>

  <!-- Top Glass Sheen -->
  <path d="M 36 140 C 36 82, 82 36, 140 36 L 372 36 C 430 36, 476 82, 476 140 L 476 210 C 360 240, 150 240, 36 210 Z" fill="url(#top-gloss)"/>

  <!-- Center Hero Artwork -->
  <g filter="url(#glyph-shadow)">
    
    <!-- Prism Lens Shadow -->
    <circle cx="216" cy="216" r="94" fill="#000000" opacity="0.3"/>

    <!-- Lens Ring -->
    <circle cx="216" cy="216" r="92" fill="none" stroke="#f1f5f9" stroke-width="20"/>
    <circle cx="216" cy="216" r="82" fill="url(#prism-lens)"/>
    <circle cx="216" cy="216" r="82" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.6"/>

    <!-- Lens Specular Arc -->
    <path d="M 150 180 C 160 150, 190 140, 220 140" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.8"/>

    <!-- Handle -->
    <line x1="284" y1="284" x2="384" y2="384" stroke="url(#handle-grad)" stroke-width="28" stroke-linecap="round"/>
    <line x1="324" y1="324" x2="384" y2="384" stroke="#0f172a" stroke-width="18" stroke-linecap="round" opacity="0.3"/>

    <!-- Star Glints -->
    <polygon points="340,140 344,152 356,156 344,160 340,172 336,160 324,156 336,152" fill="#ffffff"/>
    <polygon points="130,290 132,298 140,300 132,302 130,310 128,302 120,300 128,298" fill="#ffffff" opacity="0.8"/>
    
  </g>

  <!-- Specular Rim Border -->
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="none" stroke="url(#specular-rim)" stroke-width="2.5"/>

</svg>