<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ambient Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="folder-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.40"/>
    </filter>
    <filter id="pocket-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="glyph-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Glass Specular Rim Highlight -->
    <linearGradient id="specular-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Top Gloss Sheen Overlay -->
    <linearGradient id="top-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    
    <linearGradient id="bg-archive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    
  </defs>
  
  <!-- Base Squircle with Shadow -->
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="url(#bg-archive)" filter="url(#shadow)"/>

  <!-- Top Glass Sheen -->
  <path d="M 36 140 C 36 82, 82 36, 140 36 L 372 36 C 430 36, 476 82, 476 140 L 476 210 C 360 240, 150 240, 36 210 Z" fill="url(#top-gloss)"/>

  <!-- Center Hero Artwork -->
  <g filter="url(#glyph-shadow)">
    
    <!-- Parcel Chest -->
    <rect x="110" y="110" width="292" height="292" rx="36" ry="36" fill="#451a03" stroke="#fef3c7" stroke-width="4"/>
    
    <!-- Zipper Vertical Strip -->
    <rect x="236" y="110" width="40" height="292" fill="#1e293b"/>
    <!-- Interlocking Teeth -->
    <g fill="#94a3b8">
      <rect x="238" y="130" width="16" height="10"/>
      <rect x="258" y="145" width="16" height="10"/>
      <rect x="238" y="160" width="16" height="10"/>
      <rect x="258" y="175" width="16" height="10"/>
      <rect x="238" y="190" width="16" height="10"/>
      <rect x="258" y="205" width="16" height="10"/>
      <rect x="238" y="220" width="16" height="10"/>
      <rect x="258" y="235" width="16" height="10"/>
      <rect x="238" y="250" width="16" height="10"/>
      <rect x="258" y="265" width="16" height="10"/>
      <rect x="238" y="280" width="16" height="10"/>
      <rect x="258" y="295" width="16" height="10"/>
      <rect x="238" y="310" width="16" height="10"/>
      <rect x="258" y="325" width="16" height="10"/>
      <rect x="238" y="340" width="16" height="10"/>
      <rect x="258" y="355" width="16" height="10"/>
    </g>

    <!-- Zipper Pull Slider -->
    <g transform="translate(230, 220)">
      <rect x="0" y="0" width="52" height="42" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
      <ellipse cx="26" cy="62" rx="14" ry="24" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
    </g>
    
  </g>

  <!-- Specular Rim Border -->
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="none" stroke="url(#specular-rim)" stroke-width="2.5"/>

</svg>