LABEL arch
TEXT HELP
Boot the 02_OS install medium on BIOS.
It allows you to install 02_OS or perform system maintenance.
ENDTEXT
MENU LABEL 02_OS install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the 02_OS install medium on BIOS with speakup screen reader.
It allows you to install 02_OS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL 02_OS install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on plymouth.enable=0 disablehooks=plymouth

LABEL archdebug
TEXT HELP
Boot with visible diagnostic messages and no graphical splash.
ENDTEXT
MENU LABEL 02_OS install medium (%ARCH%, BIOS) with ^diagnostics
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% plymouth.enable=0 disablehooks=plymouth
