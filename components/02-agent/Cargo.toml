[workspace]
resolver = "2"
members = [
    "crates/agent-core",
    "crates/agent-git",
    "crates/agent-index",
    "crates/agent-parser",
    "crates/agent-memory",
    "crates/agent-context",
    "crates/agent-mcp",
    "crates/agent-daemon",
    "crates/agent-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["02_OS Systems Engineering Team <https://github.com/csy20/02_OS>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/csy20/02_OS"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
rusqlite = { version = "0.33", features = ["bundled"] }
git2 = { version = "0.20", default-features = false }
ignore = "0.4"
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.17"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-c = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-dart = "0.2"
regex = "1.10"
libc = "0.2"
